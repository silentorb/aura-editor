[package]
name = "aura_editor_tauri"
version = "0.1.0"
description = "Experimental Tauri host for Aura Editor (React UI)"
authors = ["you"]
edition = "2021"
license = "MIT"

[lib]
name = "aura_editor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
