[package]
name = "imp_graph_editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Iced Imp graph-dag editor building blocks (canvas, edit helpers, chrome widgets)"
repository = "https://github.com/silentorb/aura-editor"

[dependencies]
iced = { version = "0.14", features = ["canvas"] }
imp_core_types = { path = "../../../imp-rs/crates/imp_core_types" }
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
