[package]
name = "aura_editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GUI frontend and music/audio designer surface for Aura"
repository = "https://github.com/silentorb/aura-editor"

[[bin]]
name = "aura-editor"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["canvas"] }
imp_core_types = { path = "../imp-rs/crates/imp_core_types" }
petgraph = "0.8"
rfd = "0.15"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iced_test = "0.14"
