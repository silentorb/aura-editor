[workspace]
members = [".", "crates/aura_interfaces", "crates/aura_ext_builtin"]
resolver = "2"

[package]
name = "aura_editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GUI frontend and music/audio designer surface for Aura"
repository = "https://github.com/silentorb/aura-editor"

[[bin]]
name = "aura-editor"
path = "src/main.rs"

[dependencies]
aura_ext_builtin = { path = "crates/aura_ext_builtin" }
aura_interfaces = { path = "crates/aura_interfaces" }
directories = "6"
iced = { version = "0.14", features = ["canvas"] }
imp_core_types = { path = "../imp-rs/crates/imp_core_types" }
petgraph = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iced_test = "0.14"
