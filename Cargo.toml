[workspace]
members = [
    ".",
    "crates/aura_interfaces",
    "crates/aura_ext_builtin",
    "crates/aura_ext_notation",
    "crates/imp_graph_editor",
]
resolver = "2"

[package]
name = "aura_editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GUI frontend and music/audio designer surface for Aura"
repository = "https://github.com/silentorb/aura-editor"

[[bin]]
name = "aura-editor"
path = "src/main.rs"

[dependencies]
aura_ext_builtin = { path = "crates/aura_ext_builtin" }
aura_ext_notation = { path = "crates/aura_ext_notation" }
aura_interfaces = { path = "crates/aura_interfaces" }
aura_imp = { path = "../aura-engine/crates/aura_imp" }
aura_integration = { path = "../aura-engine/crates/aura_integration" }
aura_io_cpal = { path = "../aura-engine/crates/aura_io_cpal" }
aura_render = { path = "../aura-engine/crates/aura_render" }
aura_sample = { path = "../aura-engine/crates/aura_sample" }
aura_sequencing = { path = "../aura-engine/crates/aura_sequencing" }
directories = "6"
iced = { version = "0.14", features = ["canvas", "tokio"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu"] }
tokio = { version = "1", features = ["time"] }
imp_core_types = { path = "../imp-rs/crates/imp_core_types" }
imp_graph_editor = { path = "crates/imp_graph_editor" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iced_test = "0.14"
